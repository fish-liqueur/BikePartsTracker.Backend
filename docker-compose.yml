services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bikepartstracker-postgres
    environment:
      POSTGRES_DB: BikePartsTracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bikepartstracker-network
    restart: unless-stopped

  # .NET Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bikepartstracker-app
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - DOTNET_RUNNING_IN_CONTAINER=true
    depends_on:
      - postgres
    networks:
      - bikepartstracker-network
    restart: unless-stopped
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Mount appsettings separately (read-only)
      - ./appsettings.Docker.json:/app/appsettings.Development.json:ro
      # Exclude build artifacts from volume mount
      - /app/bin
      - /app/obj

volumes:
  postgres_data:

networks:
  bikepartstracker-network:
    driver: bridge
